name: pawdo
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 🎮 FLAME ENGINE
  flame: ^1.23.0

  # 🔥 FIREBASE
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.7.7
  firebase_messaging: ^14.9.4
  cloud_functions: ^4.7.6
  flutter_riverpod: ^2.6.1
  path_provider: ^2.1.5
  crypto: ^3.0.6
  # Compatible with the current Firebase 2.x/14.x dependency family.
  geolocator: ^12.0.0

  # 📸 IMÁGENES
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ▶️ YOUTUBE / CINE PAWDO
  youtube_player_iframe: ^5.1.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0
  confetti: ^0.8.0
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
   
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/backgrounds/
    - assets/images/houses/
    - assets/images/avatars/
    - assets/images/pets/
    - assets/images/furniture/
    - assets/images/garden/
    - assets/images/ui/
    - assets/audio/
    - assets/images/actions/
    - assets/images/interior/
    - assets/images/games/ludo/
